# .ai-harness.conf — sourced as POSIX sh by ai-harness/bin/aih (ADR-09).
# Everything project-specific lives here; nothing else in ai-harness/ knows the project.

AI_HARNESS_PROJECT="ai-harness"
AI_HARNESS_TRUNK="ai-harness-trunk"
AI_HARNESS_WORKTREE_ROOT="../ai-harness-worktrees"
AI_HARNESS_PREFIXES="feat fix doc chore"
AI_HARNESS_MAX_WORKERS=3
AI_HARNESS_DIFF_SOFT_LIMIT=400

# Unset: the harness prints the command and the boot prompt to run yourself.
# That is a supported path, not a degraded one — it is what lets the harness
# work on a platform nobody has written an adapter for. A detached agent needs
# whatever flag its CLI takes to act without prompting; that flag goes here.
AI_HARNESS_AGENT_CMD="claude --model sonnet --allowedTools Read,Edit,Write,Bash --permission-prompts none --max-budget-usd 10 -p"

# run kills an agent past this many seconds, and checks every POLL seconds.
AI_HARNESS_AGENT_TIMEOUT=3600
AI_HARNESS_RUN_POLL=10

# Only gates that can actually run.
AI_HARNESS_GATES="shellcheck shellsize"
AI_HARNESS_QUICK_GATES="shellcheck"

ai_harness_gate_shellcheck() {
	shellcheck -s sh ai-harness/bin/aih ai-harness/lib/*.sh ai-harness/verbs/*.sh
}

# The merge gate is only worth trusting if someone actually reads it, so the
# harness's own source is capped per file rather than in total. A total was
# tried and abandoned: it says nothing about whether any single file can be
# held in the head, and it turns every addition into a negotiation.
AI_HARNESS_SHELL_MAX_LINES=400
ai_harness_gate_shellsize() {
	_over=$(wc -l ai-harness/bin/aih ai-harness/lib/*.sh ai-harness/verbs/*.sh |
		awk -v m="$AI_HARNESS_SHELL_MAX_LINES" '$2 != "total" && $1 > m { print "  " $2 ": " $1 " lines" }')
	[ -z "$_over" ] || {
		printf 'over %s lines — split it:\n%s\n' "$AI_HARNESS_SHELL_MAX_LINES" "$_over"
		return 1
	}
}

# What each gate needs on PATH, asserted before any gate runs.
AI_HARNESS_GATE_TOOLS_shellcheck="shellcheck"
AI_HARNESS_GATE_TOOLS_shellsize="wc awk"

# A path here parks for a human even when a todo declares it. The default,
# "AGENTS.md ai-harness/*", keeps agents off the rules and the harness; this
# repo is the harness, so it frees ai-harness/* and holds CI instead.
# .ai-harness.conf itself is always protected.
AI_HARNESS_PROTECTED="AGENTS.md .github/workflows/*"
