name: ci

on:
  push:
  pull_request:

# shellcheck is pinned to the version developers run locally: a newer or older
# one flags different lines, and the gate must say the same thing everywhere.
env:
  SHELLCHECK_VERSION: v0.11.0

# Linux only. macOS is what every developer runs the gate on before each
# commit, so CI covers the platform nobody has at hand: dash and GNU tools.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          f="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$f" | tar -xJ
          mkdir -p "$HOME/.local/bin"
          mv "shellcheck-$SHELLCHECK_VERSION/shellcheck" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: aih gate
        run: |
          shellcheck --version
          bin/aih gate
