name: ci

on:
  push:
  pull_request:

# shellcheck is pinned to the version developers run locally: a newer or older
# one flags different lines, and the gate must say the same thing everywhere.
env:
  SHELLCHECK_VERSION: v0.11.0

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          case "$RUNNER_OS" in
            Linux) f="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" ;;
            macOS) f="shellcheck-$SHELLCHECK_VERSION.darwin.aarch64.tar.xz" ;;
          esac
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$f" | tar -xJ
          mkdir -p "$HOME/.local/bin"
          mv "shellcheck-$SHELLCHECK_VERSION/shellcheck" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: aih gate
        run: |
          shellcheck --version
          bin/aih gate
