name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: aih gate
        run: ai-harness/bin/aih gate
