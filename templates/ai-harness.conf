# .ai-harness.conf — sourced as POSIX sh by bin/aih (ADR-09).
# Everything project-specific lives here; nothing else in the tree knows the
# project's language.

AI_HARNESS_PROJECT="@PROJECT@"
AI_HARNESS_TRUNK="@TRUNK@"
# A relative root resolves against the main worktree. A bare repository has
# none: there it is the folder holding the .bare directory, so "worktrees"
# lands inside it and the default lands beside it.
AI_HARNESS_WORKTREE_ROOT="@WORKTREE_ROOT@"
AI_HARNESS_PREFIXES="feat fix doc chore"
AI_HARNESS_MAX_WORKERS=3

# yes: a green integrate pushes the trunk to its upstream, fast-forward only.
# no or unset: it never pushes, and a human pushes the trunk by hand.
AI_HARNESS_PUSH_TRUNK="@PUSH_TRUNK@"

# Unset: the harness prints the command and the boot prompt to run yourself.
# That is a supported path, not a degraded one — it is what lets the harness
# work on a platform nobody has written an adapter for. A detached agent needs
# whatever flag its CLI takes to act without prompting; that flag goes here.
# AI_HARNESS_AGENT_CMD="claude --allowedTools Read,Edit,Write,Bash --permission-prompts none -p"

# run kills an agent past this many seconds, and checks every POLL seconds.
AI_HARNESS_AGENT_TIMEOUT=3600
AI_HARNESS_RUN_POLL=10

# Detected from @DETECTED@ by aih init. Read it before trusting it: a wrong
# gate is worse than no gate, because it discredits every result the harness
# reports afterwards.
@GATES@
