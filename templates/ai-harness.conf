# .ai-harness.conf — sourced as POSIX sh by bin/aih (ADR-09).

AI_HARNESS_PROJECT="@PROJECT@"
AI_HARNESS_TRUNK="@TRUNK@"
# Where claim and init put worktrees; relative paths resolve against the main worktree.
AI_HARNESS_WORKTREE_ROOT="@WORKTREE_ROOT@"
AI_HARNESS_PREFIXES="feat fix doc chore"
# The most active claims at once; claim refuses past it.
AI_HARNESS_MAX_WORKERS=3

# yes: a green integrate pushes the trunk to its upstream, fast-forward only.
AI_HARNESS_PUSH_TRUNK="@PUSH_TRUNK@"

# The command dispatch and run start for each agent; unset, dispatch prints it for you to run.
AI_HARNESS_AGENT_CMD="claude --model sonnet --allowedTools Read,Edit,Write,Bash --permission-prompts none --max-budget-usd 10 -p"

# run kills an agent past this many seconds.
AI_HARNESS_AGENT_TIMEOUT=3600
# Seconds between run's ticks.
AI_HARNESS_RUN_POLL=10

# Detected from @DETECTED@ by aih init; check it before trusting it.
@GATES@
